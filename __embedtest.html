<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Money Transfer · Riverstone Credit Union</title>
  <meta name="description" content="Send money to family and friends in 80+ countries, right from your Riverstone account. Fast, secure, and transparent." />

  <!-- PayMitto brand fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Extreme:wght@400;700&family=Karla:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head><body style="margin:0"><div class="calc" id="calc">
            <div class="calc__head">
              <h3>Estimate your transfer</h3>
              <span class="calc__badge">Live demo</span>
            </div>

            <div class="field field--send">
              <label for="send-amount">Total you send</label>
              <div class="field__control">
                <span class="ccy">$</span>
                <input id="send-amount" type="text" inputmode="decimal" value="100" aria-label="Amount to send in US dollars" />
                <span class="ccy">USD</span>
              </div>
            </div>

            <div class="field">
              <label id="dest-label" for="country-trigger">Destination</label>
              <div class="combo" id="country-combo">
                <button type="button" id="country-trigger" class="field__control combo__trigger"
                        aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dest-label country-value">
                  <span class="combo__flag" id="country-flag" aria-hidden="true">🌐</span>
                  <span class="combo__value" id="country-value">Select a destination</span>
                  <svg class="combo__chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="combo__panel" id="country-panel" hidden>
                  <div class="combo__search">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input type="text" id="country-search" role="combobox" aria-expanded="true"
                           aria-controls="country-listbox" aria-autocomplete="list" autocomplete="off"
                           spellcheck="false" placeholder="Type a country or currency" aria-label="Search destinations" />
                  </div>
                  <ul class="combo__list" id="country-listbox" role="listbox" aria-label="Destinations"></ul>
                  <p class="combo__empty" id="country-empty" hidden>No destinations match that search.</p>
                </div>
                <!-- State + no-JS fallback; the combobox above is the accessible UI. -->
                <select id="country" class="combo__native" tabindex="-1" aria-hidden="true"></select>
              </div>
            </div>

            <div class="calc__methods" role="group" aria-label="Delivery method">
              <button type="button" data-method="bank">Bank account</button>
              <button type="button" data-method="debit">Debit card deposit</button>
              <button type="button" data-method="cash" class="active">Cash pickup</button>
            </div>

            <div class="field field--receive">
              <label for="receive-amount">Total to recipient</label>
              <div class="field__control">
                <span class="amount" id="receive-amount">—</span>
                <span class="ccy" id="receive-ccy">MXN</span>
              </div>
            </div>

            <div class="calc__lines">
              <div class="calc__line"><span>Estimated exchange rate</span><strong id="rate-line">—</strong></div>
              <div class="calc__line"><span>Estimated transfer fees</span><span id="fee-line"><span class="was">$2.99</span><span class="free">$0.00</span><span class="fee-ccy"> USD</span></span></div>
              <div class="calc__line"><span>Estimated delivery</span><strong id="eta-line">Within minutes</strong></div>
            </div>

            <a class="btn btn--primary btn--block btn--lg" href="#">Start this transfer</a>
            <p class="calc__footnote" id="calc-footnote">Illustrative rates for demonstration only.</p>
          </div>
        </div>
      </div>
    </section>

    </body></html>
